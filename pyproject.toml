[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bytecli"
version = "0.1.0"
description = "A production-quality AI Coding Agent Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12.4"
authors = [
    {name = "ByteCli", email = "dev@bytecli.ai"},
]
keywords = ["ai", "coding-agent", "cli", "llm", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0,<3",
    "httpx>=0.27,<1",
    "prompt-toolkit>=3.0.50",
    "rich>=14.0.0",
    "pygments>=2.17",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0,<7",
    "json5>=0.9,<1",
    "platformdirs>=4.0,<5",
    "gitpython>=3.1,<4",
    "watchfiles>=0.21,<1",
    "anyio>=4.0,<5",
    "loguru>=0.7,<1",
    "tomli-w>=1.0,<2",
    "pyperclip>=1.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.urls]
Homepage = "https://github.com/bytecli/bytecli"
Issues = "https://github.com/bytecli/bytecli/issues"

[project.scripts]
bytecli = "bytecli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bytecli*"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "build/"]
disallow_untyped_defs = true
disallow_any_unimported = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "YTT", "ANN", "BLE", "RUF"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "ANN101", "ANN102", "ANN401", "BLE001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
